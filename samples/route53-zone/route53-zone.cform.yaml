# aws cloudformation deploy --region us-east-1 --stack-name prodbytes-route53-zone --template-file samples/route53-zone/route53-zone.cform.yaml --parameter-overrides TenantId=prodbytes DomainName=prodbyt.es
# aws cloudformation delete-stack --region us-east-1 --stack-name prodbytes-route53-zone
#
# Deploy in us-east-1: the zone itself is global, but CloudFormation exports
# are regional and the certificate stack (acm-cert) that imports them must
# live in us-east-1 for CloudFront.
#
# After creation, point the domain's NS records at the registrar to the
# NameServers output - nothing resolves (and ACM cannot validate) until then.

Description: Public Route 53 hosted zone for a domain.

Parameters:
  TenantId:
    Type: String
    Default: default
    Description: Prefix for export names and tag value for Application

  DomainName:
    Type: String
    MinLength: 1
    MaxLength: 63
    AllowedPattern: "^[a-z0-9][a-z0-9.-]*[a-z0-9]$"
    Description: Domain the zone serves, e.g. example.com

Resources:
  HostedZone:
    Type: AWS::Route53::HostedZone
    Properties:
      Name: !Ref DomainName
      HostedZoneConfig:
        Comment: !Sub "Public zone for ${DomainName} (${TenantId})"
      HostedZoneTags:
        - Key: TenantId
          Value: !Ref TenantId

Outputs:
  HostedZoneId:
    Description: Route 53 hosted zone ID
    Value: !Ref HostedZone
    Export:
      Name: !Sub ${TenantId}-HostedZoneId

  HostedZoneName:
    Description: Domain the zone serves
    Value: !Ref DomainName
    Export:
      Name: !Sub ${TenantId}-HostedZoneName

  NameServers:
    Description: Name servers to delegate to at the registrar
    Value: !Join [",", !GetAtt HostedZone.NameServers]
    Export:
      Name: !Sub ${TenantId}-NameServers
